<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0C}
.gr{--bg:#0B0B0C;--s1:#141416;--s2:#1C1C1F;--s3:#2C2C31;--line:rgba(242,240,234,.1);--line2:rgba(242,240,234,.22);--tx:#F2F0EA;--tx2:#BAB8B0;--tx3:#94928A;background:var(--bg);color:var(--tx);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.gr *{box-sizing:border-box}
.gr h1,.gr h2,.gr p{margin:0}
.d{font-stretch:68%;font-weight:800;text-transform:uppercase;line-height:.9}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border:1px solid var(--line2);border-radius:2px;background:transparent;color:var(--tx);font:600 14px/1 'Archivo',sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#0B0B0C}
.lbl{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px}
.inp{height:52px;width:100%;background:var(--s1);border:1px solid var(--line2);border-radius:2px;color:var(--tx);font:400 16px 'Archivo',sans-serif;padding:0 14px}
.gr a{color:inherit}.gr a:hover{color:var(--acc)}
</style>
</helmet>
<div class="gr" style="--acc: {{accent}}; min-height: 100vh; display: flex; flex-wrap: wrap">
  <section style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 48px 56px; border-right: 1px solid var(--line); background-color: #0E0E10; background-image: repeating-linear-gradient(135deg, rgba(242,240,234,.035) 0 1px, transparent 1px 9px)">
    <a href="Discover.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none"><span style="display: block; width: 14px; height: 14px; background: var(--acc)"></span><span class="d" style="font-size: 26px; line-height: 1">Goodraves</span></a>
    <div>
      <h1 class="d" style="font-size: clamp(72px, 8vw, 128px)">Every rave you went to. Every one you will.</h1>
      <p class="m" style="color: var(--tx2); margin-top: 28px">Track festivals · Rate sets · Follow artists · See where friends go</p>
    </div>
  </section>
  <section style="flex: 1 1 480px; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 48px 24px">
    <form style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 20px">
      <h2 class="d" style="font-size: 56px">Log in</h2>
      <div><label class="lbl" for="u">Username</label><input id="u" class="inp" autocomplete="username"></div>
      <div><label class="lbl" for="pw">Password</label><input id="pw" class="inp" type="password" autocomplete="current-password"></div>
      <button class="btn p" type="submit" style="margin-top: 4px">Log in</button>
      <p style="color: var(--tx2); font-size: 14px">No account yet? <a href="#">Create one</a></p>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4FF3F","options":["#D4FF3F","#FF5C39","#B2A6FF","#F2F0EA"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D4FF3F' };
  }
}
</script>
</body>
</html>
