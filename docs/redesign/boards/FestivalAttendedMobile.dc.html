<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lichtval Festival 2025, attended (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0C}
.gr{--bg:#0B0B0C;--s1:#141416;--s2:#1C1C1F;--s3:#2C2C31;--line:rgba(242,240,234,.1);--line2:rgba(242,240,234,.22);--tx:#F2F0EA;--tx2:#BAB8B0;--tx3:#94928A;--go:#B2A6FF;--warn:#FF9A52;--off:#77756E;background:var(--bg);color:var(--tx);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.gr *{box-sizing:border-box}
.gr h1,.gr h2,.gr h3,.gr p{margin:0}
.d{font-stretch:68%;font-weight:800;text-transform:uppercase;line-height:.9}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1px solid var(--line2);border-radius:2px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:2px;background:transparent;color:var(--tx);font:600 13px/1 'Archivo',sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.ic{width:44px;padding:0}
.img{background-color:#18181B;background-image:repeating-linear-gradient(135deg,rgba(242,240,234,.045) 0 1px,transparent 1px 9px);position:relative;overflow:hidden}
.seg{display:flex;border:1px solid var(--line2);border-radius:2px}
.seg button{flex:1;min-height:44px;padding:0 12px;background:none;border:0;color:var(--tx2);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.seg .on{background:var(--tx);color:#0B0B0C}
.lbl{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px}
.ta{width:100%;background:var(--s1);border:1px solid var(--line2);border-radius:2px;color:var(--tx);font:400 15px/1.5 'Archivo',sans-serif;padding:12px 14px;resize:vertical}
.av{display:flex;align-items:center;justify-content:center;background:var(--s2);border:1px solid var(--line);font-stretch:68%;font-weight:800;text-transform:uppercase;color:var(--tx2);flex:none}
.vb{height:48px;border-radius:2px;cursor:pointer}
.rb{width:28px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
.gr a{color:inherit}.gr a:hover{color:var(--acc)}
</style>
</helmet>
<div class="gr" style="--acc: {{accent}}; width: 390px; min-height: 2050px; position: relative; padding-bottom: 88px">
  <header style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-bottom: 1px solid var(--line)">
    <a href="MyFestivalsMobile.dc.html" class="btn ic" style="border: 0" aria-label="Back to my festivals"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <span class="m" style="color: var(--tx2)">Festival</span>
    <button class="btn ic" style="border: 0" aria-label="Share festival"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"></path></svg></button>
  </header>

  <section style="padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid var(--line)">
    <div style="display: flex; gap: 14px; align-items: flex-start">
      <div class="img" style="width: 96px; height: 96px; flex: none"><span class="d" style="position: absolute; right: -2px; bottom: -8px; font-size: 64px; color: rgba(242,240,234,.08)">LV</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span class="m">Sat 29 Nov 2025</span>
        <span style="color: var(--tx2)">Gashouder, Amsterdam</span>
        <div style="display: flex; gap: 6px; margin-top: 4px"><span class="chip">Melodic techno</span><span class="chip">Past</span></div>
      </div>
    </div>
    <h1 class="d" style="font-size: 64px">Lichtval Festival</h1>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 0 0 14px; border: 1px solid var(--line2)">
      <span style="width: 22px; height: 22px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--acc); color: #0B0B0C"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
      <span style="flex: 1"><strong>Attended</strong> <span style="color: var(--tx2)">· saw 5 of 22</span></span>
      <button class="btn ic" style="border: 0; border-left: 1px solid var(--line2); min-height: 50px" aria-label="More actions" aria-haspopup="menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </div>
  </section>

  <section style="padding: 28px 20px; display: flex; flex-direction: column; gap: 24px; background: var(--s1); border-bottom: 1px solid var(--line)">
    <h2 class="d" style="font-size: 36px">Your night</h2>
    <div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span class="lbl">Vibe rating</span><span class="m" style="font-size: 12px">4 / 5</span></div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px" role="group" aria-label="Vibe rating">
        <button class="vb" aria-label="Rate 1" aria-pressed="false" style="border: 0; background: var(--acc)"></button>
        <button class="vb" aria-label="Rate 2" aria-pressed="false" style="border: 0; background: var(--acc)"></button>
        <button class="vb" aria-label="Rate 3" aria-pressed="false" style="border: 0; background: var(--acc)"></button>
        <button class="vb" aria-label="Rate 4" aria-pressed="true" style="border: 0; background: var(--acc)"></button>
        <button class="vb" aria-label="Rate 5" aria-pressed="false" style="border: 1px solid var(--off); background: transparent"></button>
      </div>
    </div>
    <div>
      <label class="lbl" for="notes">Personal notes · only you</label>
      <textarea id="notes" class="ta" rows="4">Closing set with the strobes off was the best moment of the year. Go earlier next time, the queue at 21:00 was long.</textarea>
      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 8px"><span class="m" style="color: var(--tx3)">Saved</span><button class="btn">Save</button></div>
    </div>
    <div>
      <label class="lbl" for="pub">Comment · friends see this</label>
      <textarea id="pub" class="ta" rows="2" placeholder="What should your friends know?">Best Gashouder night so far.</textarea>
    </div>
  </section>

  <section style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 class="d" style="font-size: 40px">Lineup</h2>
      <span class="m" style="color: var(--tx3)">5 of 22 seen</span>
    </div>
    <div class="seg" role="tablist" aria-label="View"><button role="tab" aria-selected="false">Timetable</button><button class="on" role="tab" aria-selected="true">Lineup</button></div>
    <p style="font-size: 14px; color: var(--tx2)">Tap a square to rate a set. Rating it marks it as seen.</p>
    <div>
      <sc-for list="{{lineup}}" as="a" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-bottom: 1px solid var(--line)">
          <sc-if value="{{a.solo}}" hint-placeholder-val="{{ true }}"><a href="ArtistMobile.dc.html" class="av" style="width: 40px; height: 40px; font-size: 16px; text-decoration: none" aria-label="{{a.n}}">{{a.i}}</a></sc-if>
          <sc-if value="{{a.b2b}}" hint-placeholder-val="{{ false }}"><span style="width: 40px; height: 40px; flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 2px" aria-hidden="true"><span class="av" style="font-size: 13px">{{a.i}}</span><span class="av" style="font-size: 13px">{{a.i2}}</span></span></sc-if>
          <div style="flex: 1; min-width: 0">
            <a href="ArtistMobile.dc.html" style="display: block; font-size: 15px; font-weight: 600; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.n}}</a>
            <span class="m" style="color: {{a.subc}}">{{a.sub}}</span>
          </div>
          <div role="group" aria-label="Rate {{a.n}}" style="display: flex">
            <sc-for list="{{a.sq}}" as="q" hint-placeholder-count="5">
              <button class="rb" aria-label="{{q.l}}" aria-pressed="{{q.p}}"><span style="display: block; width: 14px; height: 14px; background: {{q.bg}}; border: 1px solid {{q.bc}}"></span></button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <button class="btn" style="margin-top: 8px">Show all 22 artists</button>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="TabBar" active="mine" hint-size="390px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4FF3F","options":["#D4FF3F","#FF5C39","#B2A6FF","#F2F0EA"]},"$preview":{"width":390,"height":2050}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['Nora Vey', 'NV', 'Main · 23:00', 5],
      ['Ilse Morrow', 'IM', 'Main · 21:00', 4],
      ['Bleek b2b Corso', 'B', 'B2B · Hall 2 · 01:00', 4, 'C'],
      ['Halcyon Unit (live)', 'HU', 'Hall 2 · 22:00', 3],
      ['Teo Marin', 'TM', 'Main · 19:00', 4],
      ['Mira Okafor', 'MO', 'Not seen', 0],
      ['Femke Rook', 'FR', 'Not seen', 0],
      ['Otis Vane', 'OV', 'Not seen', 0],
    ];
    const lineup = raw.map(([n, i, sub, r, i2]) => ({
      n, i, sub, i2: i2 || '',
      b2b: !!i2,
      solo: !i2,
      subc: r ? '#94928A' : '#77756E',
      sq: [1, 2, 3, 4, 5].map((k) => ({
        l: 'Rate ' + n + ' ' + k + ' of 5',
        p: k === r ? 'true' : 'false',
        bg: k <= r ? 'var(--acc)' : 'transparent',
        bc: k <= r ? 'var(--acc)' : 'var(--off)',
      })),
    }));
    return { accent: this.props.accent ?? '#D4FF3F', lineup };
  }
}
</script>
</body>
</html>
