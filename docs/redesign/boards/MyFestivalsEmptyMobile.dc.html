<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My festivals, first run (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0C}
.gr{--bg:#0B0B0C;--s1:#141416;--s2:#1C1C1F;--s3:#2C2C31;--line:rgba(242,240,234,.1);--line2:rgba(242,240,234,.22);--tx:#F2F0EA;--tx2:#BAB8B0;--tx3:#94928A;background:var(--bg);color:var(--tx);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.gr *{box-sizing:border-box}
.gr h1,.gr h2,.gr h3,.gr p{margin:0}
.d{font-stretch:68%;font-weight:800;text-transform:uppercase;line-height:.9}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:2px;background:transparent;color:var(--tx);font:600 12px/1 'Archivo',sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--acc);border-color:var(--acc);color:#0B0B0C}
.img{background-color:#18181B;background-image:repeating-linear-gradient(135deg,rgba(242,240,234,.045) 0 1px,transparent 1px 9px);position:relative;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gr a{color:inherit}.gr a:hover{color:var(--acc)}
</style>
</helmet>
<div class="gr" style="--acc: {{accent}}; width: 390px; min-height: 1200px; position: relative; padding-bottom: 88px">
  <header style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px; border-bottom: 1px solid var(--line)">
    <a href="DiscoverMobile.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none"><span style="display: block; width: 12px; height: 12px; background: var(--acc)"></span><span class="d" style="font-size: 22px; line-height: 1">Goodraves</span></a>
    <button aria-label="Account menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0"><span class="d" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--s2); border: 1px solid var(--line2); font-size: 16px; line-height: 1; color: var(--tx)">M</span></button>
  </header>

  <section style="padding: 32px 20px 0; display: flex; flex-direction: column; gap: 20px">
    <h1 class="d" style="font-size: 40px">My festivals</h1>
    <p class="d" style="font-size: 28px; color: var(--tx2)">Your history starts with one festival.</p>
    <form role="search" style="display: flex">
      <label for="fqm" class="sr">Search for a festival you went to</label>
      <input id="fqm" placeholder="Which festival did you go to last?" style="flex: 1; min-width: 0; height: 52px; padding: 0 14px; background: var(--s1); border: 1px solid var(--line2); border-right: 0; color: var(--tx); font: 400 16px 'Archivo', sans-serif">
      <button class="btn p" aria-label="Search" style="width: 52px; min-height: 52px; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    </form>
  </section>

  <section style="padding: 32px 20px 0">
    <h2 class="m" style="color: var(--tx2); padding-bottom: 10px; border-bottom: 1px solid var(--line2)">Popular near you · tap to add</h2>
    <sc-for list="{{popular}}" as="f" hint-placeholder-count="5">
      <div style="display: flex; gap: 12px; align-items: center; min-height: 72px; border-bottom: 1px solid var(--line)">
        <div class="img" style="width: 48px; height: 48px; flex: none"><span class="d" style="position: absolute; right: -2px; bottom: -4px; font-size: 30px; color: rgba(242,240,234,.1)">{{f.ab}}</span></div>
        <div style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600">{{f.name}}</span><span class="m" style="color: var(--tx3)">{{f.date}}</span></div>
        <button class="btn" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{f.action}}</button>
      </div>
    </sc-for>
  </section>

  <section style="padding: 32px 20px 0; display: flex; flex-direction: column">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 16px 0; border-top: 1px solid var(--line)">
        <span class="d" style="font-size: 36px; color: {{s.c}}">{{s.n}}</span>
        <div><h3 style="font-size: 16px; font-weight: 600">{{s.t}}</h3><p style="font-size: 14px; color: var(--tx2); margin-top: 2px">{{s.b}}</p></div>
      </div>
    </sc-for>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="TabBar" active="mine" hint-size="390px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4FF3F","options":["#D4FF3F","#FF5C39","#B2A6FF","#F2F0EA"]},"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D4FF3F';
    const popular = [
      { ab: 'KW', name: 'Kade Weekender', date: 'Nov 2025 · Amsterdam', action: 'Attended' },
      { ab: 'LV', name: 'Lichtval Festival', date: 'Nov 2025 · Amsterdam', action: 'Attended' },
      { ab: 'OG', name: 'Ondergrond', date: 'Oct 2025 · Rotterdam', action: 'Attended' },
      { ab: 'KW', name: 'Kade Weekender', date: 'Nov 2026 · Amsterdam', action: 'Going' },
      { ab: 'PP', name: 'Polderpuls NYE', date: 'Dec 2026 · Rotterdam', action: 'Going' },
    ];
    const steps = [
      { n: '01', t: 'Add festivals', b: 'Past ones become your history, upcoming ones your schedule.', c: '#F2F0EA' },
      { n: '02', t: 'Rate the sets you saw', b: 'Builds your Top DJs and yearly passport.', c: '#94928A' },
      { n: '03', t: 'Follow artists', b: 'Their next gigs show up in Following.', c: '#94928A' },
    ];
    return { accent, popular, steps };
  }
}
</script>
</body>
</html>
