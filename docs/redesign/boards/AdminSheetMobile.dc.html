<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Festival admin actions (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0C}
.gr{--bg:#0B0B0C;--s1:#141416;--s2:#1C1C1F;--s3:#2C2C31;--line:rgba(242,240,234,.1);--line2:rgba(242,240,234,.22);--tx:#F2F0EA;--tx2:#BAB8B0;--tx3:#94928A;--err:#FF7A7A;background:var(--bg);color:var(--tx);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.gr *{box-sizing:border-box}
.gr h1,.gr h2,.gr p{margin:0}
.d{font-stretch:68%;font-weight:800;text-transform:uppercase;line-height:.9}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 20px;background:none;border:0;border-top:1px solid var(--line);color:var(--tx);text-align:left;font:400 15px 'Archivo',sans-serif;cursor:pointer}
.mi svg{flex:none;color:var(--tx2)}
</style>
</helmet>
<div class="gr" style="--acc: {{accent}}; width: 390px; height: 844px; position: relative; overflow: hidden">
  <div aria-hidden="true" style="padding: 20px; opacity: .35">
    <span class="m">Fri 06 – Sun 08 Nov 2026</span>
    <p class="d" style="font-size: 64px; margin-top: 12px">Kade Weekender</p>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.6)"></div>

  <div role="dialog" aria-label="Admin actions for Kade Weekender" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--s1); border-top: 1px solid var(--line2)">
    <div style="display: flex; justify-content: center; padding: 10px"><span style="display: block; width: 36px; height: 4px; background: var(--s3)"></span></div>
    <div style="padding: 4px 20px 16px">
      <p class="m" style="color: var(--tx3)">Admin · festival</p>
      <h2 class="d" style="font-size: 28px; margin-top: 4px">Kade Weekender</h2>
      <p class="m" style="color: var(--tx3); margin-top: 4px">ra-2403879</p>
    </div>
    <button class="mi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg><span style="flex: 1"><span style="display: block">Link Partyflock timetable</span><span class="m" style="color: var(--tx3)">Linked · synced 06:21</span></span></button>
    <button class="mi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v6a6 6 0 0 0 6 6h6M14 12l4 4-4 4M6 20v-2"></path></svg><span style="flex: 1">Merge a duplicate into this one</span></button>
    <button class="mi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg><span style="flex: 1">Edit details</span></button>
    <p class="m" style="padding: 16px 20px 6px; color: var(--tx3); border-top: 1px solid var(--line)">Lineup · long-press an artist</p>
    <p style="padding: 0 20px 14px; font-size: 14px; color: var(--tx2)">Rename, split a B2B, or create a B2B from two artists.</p>
    <button class="mi" style="color: var(--err)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7A7A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg><span style="flex: 1"><span style="display: block">Re-import festival</span><span class="m" style="color: var(--tx3)">Replaces the lineup · asks to confirm</span></span></button>
    <div style="height: 20px"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4FF3F","options":["#D4FF3F","#FF5C39","#B2A6FF","#F2F0EA"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D4FF3F' };
  }
}
</script>
</body>
</html>
