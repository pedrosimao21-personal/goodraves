<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stats: top DJs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0C}
.gr{--bg:#0B0B0C;--s1:#141416;--s2:#1C1C1F;--s3:#2C2C31;--line:rgba(242,240,234,.1);--line2:rgba(242,240,234,.22);--tx:#F2F0EA;--tx2:#BAB8B0;--tx3:#94928A;--go:#B2A6FF;--warn:#FF9A52;background:var(--bg);color:var(--tx);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.gr *{box-sizing:border-box}
.gr h1,.gr h2,.gr h3,.gr p{margin:0}
.d{font-stretch:68%;font-weight:800;text-transform:uppercase;line-height:.9}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--line2);border-radius:2px;background:transparent;color:var(--tx);font:600 13px/1 'Archivo',sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--tx)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#0B0B0C}
.btn.sm{min-height:36px;padding:0 12px;font-size:12px}
.r{display:inline-flex;gap:3px;vertical-align:middle}.r i{display:block;width:10px;height:10px;background:var(--s3)}.r i.on{background:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:2px}
.seg button,.seg a{display:flex;align-items:center;min-height:40px;padding:0 16px;background:none;border:0;color:var(--tx2);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.seg .on{background:var(--tx);color:#0B0B0C}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line)}
.tabs a{display:flex;align-items:center;min-height:48px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--tx2);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.tabs .on{color:var(--tx);border-bottom-color:var(--tx)}
.av{display:flex;align-items:center;justify-content:center;background:var(--s2);border:1px solid var(--line);font-stretch:68%;font-weight:800;text-transform:uppercase;color:var(--tx2);flex:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.gr a{color:inherit}.gr a:hover{color:var(--acc)}
</style>
</helmet>
<div class="gr" style="--acc: {{accent}}; min-height: 100vh">
  <dc-import name="NavDesktop" active="stats" hint-size="100%,65px"></dc-import>
  <main class="wrap" style="padding-top: 64px; padding-bottom: 96px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
      <h1 class="d" style="font-size: 56px">Stats</h1>
      <button class="btn"><span style="color: var(--tx3)">Period</span>All time<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
    <nav class="tabs" aria-label="Stats sections" style="margin-top: 24px"><a href="TopDJs.dc.html" class="on" aria-current="page">Top DJs</a><a href="Insights.dc.html">Insights</a></nav>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-top: 32px">
      <p class="m" style="color: var(--tx2)"><span style="color: var(--tx); font-size: 14px">186</span> unique artists · <span style="color: var(--tx); font-size: 14px">412</span> sets seen</p>
      <div class="seg" role="group" aria-label="Sort by"><button class="on" aria-pressed="true">Times seen</button><button aria-pressed="false">Your rating</button></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 24px">
      <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
        <a href="Artist.dc.html" style="display: flex; flex-direction: column; background: var(--s1); border: 1px solid {{p.bc}}; text-decoration: none">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; padding: 20px">
            <span class="d" style="font-size: 96px; color: {{p.rc}}">{{p.rank}}</span>
            <span class="av" style="width: 96px; height: 96px; font-size: 40px">{{p.i}}</span>
          </div>
          <div style="padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px">
            <span class="d" style="font-size: 40px">{{p.n}}</span>
            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--line)">
              <span class="m" style="font-size: 12px">Seen {{p.seen}}×</span>
              <span style="display: flex; align-items: center; gap: 8px"><span class="r" aria-hidden="true"><sc-for list="{{p.sq}}" as="q" hint-placeholder-count="5"><i style="background: {{q}}"></i></sc-for></span><span class="m">{{p.avg}}</span></span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>

    <div style="margin-top: 40px; border-top: 1px solid var(--line2)">
      <sc-for list="{{rest}}" as="a" hint-placeholder-count="7">
        <div style="display: grid; grid-template-columns: 56px 52px minmax(0, 1fr) 160px 120px 80px; gap: 20px; align-items: center; min-height: 76px; border-bottom: 1px solid var(--line)">
          <span class="d" style="font-size: 32px; color: var(--tx3)">{{a.rank}}</span>
          <a href="Artist.dc.html" class="av" style="width: 52px; height: 52px; font-size: 20px; text-decoration: none" aria-label="{{a.n}}">{{a.i}}</a>
          <a href="Artist.dc.html" style="font-size: 18px; font-weight: 600; text-decoration: none">{{a.n}}</a>
          <span style="display: flex; align-items: center; gap: 8px"><span class="r" role="img" aria-label="{{a.label}}"><sc-for list="{{a.sq}}" as="q" hint-placeholder-count="5"><i style="background: {{q}}"></i></sc-for></span><span class="m" style="color: var(--tx2)">{{a.avg}}</span></span>
          <sc-if value="{{a.following}}" hint-placeholder-val="{{ false }}"><button class="btn sm" aria-pressed="true" style="border-color: var(--acc); color: var(--acc)"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"></path></svg>Following</button></sc-if>
          <sc-if value="{{a.notFollowing}}" hint-placeholder-val="{{ true }}"><button class="btn sm" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"></path></svg>Follow</button></sc-if>
          <span style="text-align: right"><span class="d" style="font-size: 40px">{{a.seen}}</span><span class="m" style="color: var(--tx3)">×</span></span>
        </div>
      </sc-for>
    </div>
    <button class="btn" style="margin-top: 24px">Show 20 more</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4FF3F","options":["#D4FF3F","#FF5C39","#B2A6FF","#F2F0EA"]},"$preview":{"width":1440,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D4FF3F';
    const sq = (r) => [1, 2, 3, 4, 5].map((k) => {
      const full = Math.floor(r);
      const part = Math.round((r - full) * 100);
      if (k <= full) return 'var(--acc)';
      if (k === full + 1 && part > 0) return 'linear-gradient(90deg, var(--acc) ' + part + '%, var(--s3) ' + part + '%)';
      return 'var(--s3)';
    });
    const all = [
      ['Nora Vey', 'NV', 9, 4.6, true],
      ['KASSEL', 'KA', 8, 4.3, true],
      ['Teo Marin', 'TM', 7, 4.9, false],
      ['Ilse Morrow', 'IM', 6, 4.1, true],
      ['Juno Reiss', 'JR', 6, 4.5, true],
      ['Halcyon Unit', 'HU', 5, 3.8, true],
      ['Bleek & Corso', 'BC', 5, 4.2, false],
      ['Marek Sol', 'MS', 4, 3.5, false],
      ['Venn', 'VE', 4, 4.0, true],
      ['Mira Okafor', 'MO', 4, 4.4, false],
    ].map(([n, i, seen, avg, f], k) => ({
      n, i, seen, avg: avg.toFixed(1), sq: sq(avg), label: avg.toFixed(1) + ' out of 5',
      following: f, notFollowing: !f, rank: String(k + 1).padStart(2, '0'),
    }));
    const podium = all.slice(0, 3).map((a, k) => ({ ...a, bc: k === 0 ? accent : 'rgba(242,240,234,.1)', rc: k === 0 ? accent : '#F2F0EA' }));
    const rest = all.slice(3);
    return { accent, podium, rest };
  }
}
</script>
</body>
</html>
