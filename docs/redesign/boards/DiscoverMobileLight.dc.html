<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover (mobile, light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F2EC}
.gl{--bg:#F4F2EC;--s1:#FFFFFF;--s2:#EAE7DF;--s3:#D6D3CA;--line:rgba(11,11,12,.1);--line2:rgba(11,11,12,.22);--tx:#0B0B0C;--tx2:#4A4842;--tx3:#6B6962;--ink:#4F6B00;--go:#5B4BD6;background:var(--bg);color:var(--tx);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.gl *{box-sizing:border-box}
.gl h1,.gl h2,.gl h3,.gl p{margin:0}
.d{font-stretch:68%;font-weight:800;text-transform:uppercase;line-height:.9}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1px solid var(--line2);border-radius:2px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:2px;background:transparent;color:var(--tx);font:600 13px/1 'Archivo',sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.p{background:#0B0B0C;border-color:#0B0B0C;color:var(--acc)}
.btn.go{border-color:var(--go);color:var(--go);background:rgba(91,75,214,.06)}
.btn.ic{width:44px;padding:0}
.img{background-color:#E4E1D8;background-image:repeating-linear-gradient(135deg,rgba(11,11,12,.05) 0 1px,transparent 1px 9px);position:relative;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gl a{color:inherit}.gl a:hover{color:var(--ink)}
</style>
</helmet>
<div class="gl" style="--acc: {{accent}}; width: 390px; min-height: 1500px; position: relative; padding-bottom: 88px">
  <header style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px; border-bottom: 1px solid var(--line)">
    <a href="DiscoverMobileLight.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none"><span style="display: block; width: 12px; height: 12px; background: #0B0B0C"></span><span class="d" style="font-size: 22px; line-height: 1">Goodraves</span></a>
    <button aria-label="Account menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0"><span class="d" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--s2); border: 1px solid var(--line2); font-size: 16px; line-height: 1; color: var(--tx)">M</span></button>
  </header>

  <section style="padding: 32px 20px 24px">
    <p class="m" style="color: var(--tx2)">136 upcoming in the Netherlands</p>
    <h1 class="d" style="font-size: 68px; margin-top: 12px">Find the next one.</h1>
    <form role="search" style="margin-top: 24px; display: flex">
      <label for="qml" class="sr">Search festivals, DJs, venues or cities</label>
      <input id="qml" placeholder="Festival, DJ, venue, city" style="flex: 1; min-width: 0; height: 52px; padding: 0 14px; background: var(--s1); border: 1px solid var(--line2); border-right: 0; color: var(--tx); font: 400 16px 'Archivo', sans-serif">
      <button class="btn p ic" aria-label="Search" style="width: 52px; min-height: 52px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    </form>
  </section>

  <div style="display: flex; gap: 8px; padding: 0 20px 16px; overflow-x: auto">
    <button class="btn" style="padding: 0 12px; font-size: 12px">Upcoming</button>
    <button class="btn" style="padding: 0 12px; font-size: 12px">2026</button>
    <button class="btn" style="padding: 0 12px; font-size: 12px; border-color: var(--tx); border-width: 2px">Netherlands</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 20px">
    <article style="background: var(--s1); border: 1px solid var(--line)">
      <a href="#" class="img" style="display: block; aspect-ratio: 16 / 9" aria-label="Kade Weekender">
        <span class="d" style="position: absolute; right: -4px; bottom: -14px; font-size: 120px; color: rgba(11,11,12,.07)">KW</span>
        <span class="m" style="position: absolute; top: 12px; left: 12px; padding: 3px 6px; background: #FFFFFF; border: 1px solid var(--line2)">RA</span>
      </a>
      <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 6px">
        <span class="m">Fri 06 – Sun 08 Nov</span>
        <h3 class="d" style="font-size: 34px">Kade Weekender</h3>
        <span style="font-size: 14px; color: var(--tx2)">NDSM Wharf · Amsterdam</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; margin-top: 12px; border-top: 1px solid var(--line)">
        <div style="display: flex; gap: 6px"><span class="chip">Techno</span><span class="chip">House</span></div>
        <button class="btn go" aria-pressed="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Going</button>
      </div>
    </article>

    <sc-for list="{{rows}}" as="f" hint-placeholder-count="4">
      <article style="display: flex; gap: 14px; align-items: stretch; padding-top: 16px; border-top: 1px solid var(--line)">
        <a href="#" class="img" style="display: block; width: 88px; height: 88px; flex: none" aria-label="{{f.name}}"><span class="d" style="position: absolute; right: -2px; bottom: -6px; font-size: 52px; color: rgba(11,11,12,.08)">{{f.ab}}</span></a>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span class="m">{{f.date}}</span>
          <h3 class="d" style="font-size: 24px">{{f.name}}</h3>
          <span style="font-size: 13px; color: var(--tx2)">{{f.place}}</span>
        </div>
        <button class="btn ic" aria-label="Going" aria-pressed="false" style="align-self: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </article>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="TabBar" active="discover" theme="light" hint-size="390px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4FF3F","options":["#D4FF3F","#FF5C39","#B2A6FF"]},"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { ab: 'MN', date: 'Sat 14 Nov', name: 'Machinehal Nights', place: 'Strijp-S · Eindhoven' },
      { ab: 'OG', date: 'Sat 21 Nov', name: 'Ondergrond', place: 'Maassilo · Rotterdam' },
      { ab: 'LV', date: 'Sat 28 Nov', name: 'Lichtval Festival', place: 'Gashouder · Amsterdam' },
      { ab: 'EW', date: 'Sat 12 Dec', name: 'Echoput Winter', place: 'Jaarbeurs · Utrecht' },
    ];
    return { accent: this.props.accent ?? '#D4FF3F', rows };
  }
}
</script>
</body>
</html>
