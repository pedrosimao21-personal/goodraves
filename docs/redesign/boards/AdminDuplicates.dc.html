<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Possible duplicates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0C}
.gr{--bg:#0B0B0C;--s1:#141416;--s2:#1C1C1F;--s3:#2C2C31;--line:rgba(242,240,234,.1);--line2:rgba(242,240,234,.22);--tx:#F2F0EA;--tx2:#BAB8B0;--tx3:#94928A;--warn:#FF9A52;background:var(--bg);color:var(--tx);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.gr *{box-sizing:border-box}
.gr h1,.gr h2,.gr h3,.gr p{margin:0}
.d{font-stretch:68%;font-weight:800;text-transform:uppercase;line-height:.9}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--line2);border-radius:2px;background:transparent;color:var(--tx);font:600 13px/1 'Archivo',sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--acc);border-color:var(--acc);color:#0B0B0C}
.side{flex:1;min-width:0;display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);cursor:pointer}
.side input{width:20px;height:20px;margin:2px 0 0;accent-color:#F2F0EA;flex:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.gr a{color:inherit}.gr a:hover{color:var(--acc)}
</style>
</helmet>
<div class="gr" style="--acc: {{accent}}; min-height: 100vh">
  <dc-import name="NavDesktop" active="none" hint-size="100%,65px"></dc-import>
  <main class="wrap" style="padding-top: 40px; padding-bottom: 96px">
    <a href="Admin.dc.html" class="m" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; text-decoration: none; color: var(--tx2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Admin</a>
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: 8px">
      <h1 class="d" style="font-size: 56px">Possible duplicates <span style="color: var(--tx3)">7</span></h1>
      <p style="max-width: 520px; color: var(--tx2)">The daily dedupe wasn't sure enough to merge these. Merging moves lineups, timetables and attendance onto the one you keep; old links redirect. Dismissed pairs are never suggested again.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 40px">
      <sc-for list="{{pairs}}" as="p" hint-placeholder-count="3">
        <fieldset style="margin: 0; padding: 20px; border: 1px solid var(--line2); display: flex; flex-direction: column; gap: 14px">
          <legend class="m" style="padding: 0 8px; color: var(--warn)">Why: {{p.why}}</legend>
          <div style="display: flex; gap: 12px; flex-wrap: wrap">
            <sc-for list="{{p.sides}}" as="s" hint-placeholder-count="2">
              <label class="side" style="border-color: {{s.bc}}">
                <input type="radio" name="{{p.id}}" checked="{{s.keep}}">
                <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
                  <span style="display: flex; gap: 10px; align-items: baseline"><a href="Festival.dc.html" style="font-size: 17px; font-weight: 600">{{s.name}}</a><span class="m" style="color: var(--tx3)">{{s.id}}</span></span>
                  <span class="m" style="color: var(--tx2)">{{s.meta}}</span>
                  <span class="m" style="color: var(--tx)">{{s.keepLabel}}</span>
                </span>
              </label>
            </sc-for>
          </div>
          <div style="display: flex; gap: 8px"><button class="btn p">Merge</button><button class="btn">Not a duplicate</button></div>
        </fieldset>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4FF3F","options":["#D4FF3F","#FF5C39","#B2A6FF","#F2F0EA"]},"$preview":{"width":1440,"height":1250}}'>
class Component extends DCLogic {
  renderVals() {
    const side = (name, id, meta, keep) => ({ name, id, meta, keep, bc: keep ? '#F2F0EA' : 'rgba(242,240,234,.1)', keepLabel: keep ? 'Keep this one' : '' });
    const pairs = [
      { id: 'p1', why: 'same day, same venue, 82% lineup overlap', sides: [
        side('Kade Weekender', 'ra-2403879', 'RA · 64 artists · 48 timetable slots · 12 users', true),
        side('Kade Weekender 2026 – Saturday', 'pf-498213', 'Partyflock · 19 artists · 0 slots · 1 user', false),
      ] },
      { id: 'p2', why: 'similar name, same city, one day apart', sides: [
        side('Polderpuls NYE', 'pf-501122', 'Partyflock · 40 artists · 0 slots · 3 users', true),
        side('Polderpuls New Year', 'ff-88231', 'FestivalFans · 12 artists · 0 slots · 0 users', false),
      ] },
      { id: 'p3', why: 'same venue and date, names differ', sides: [
        side('Havengeluid', 'ra-2410042', 'RA · 15 artists · 0 slots · 2 users', true),
        side('Maassilo Club Night', 'pf-503310', 'Partyflock · 6 artists · 0 slots · 0 users', false),
      ] },
    ];
    return { accent: this.props.accent ?? '#D4FF3F', pairs };
  }
}
</script>
</body>
</html>
